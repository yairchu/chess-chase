[project]
name = "chess-chase"
version = "1.2.2"
description = "A multiplayer real-time strategy game based on Chess."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi",
    "kivy",
    "pystun3",
]

[project.optional-dependencies]
build = [
    "pillow",
    "pyinstaller",
]
macos-build = [
    "pillow",
    "pyinstaller",
]

[tool.uv]
package = false

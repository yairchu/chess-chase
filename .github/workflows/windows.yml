name: Windows build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload to, e.g. v1.2.1"
        required: false
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      KIVY_GL_BACKEND: angle_sdl2

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --extra build

      - name: Build app
        run: |
          uv run python generate_icons.py
          uv run pyinstaller --clean --noconfirm --windowed --name "Chess Chase" --icon "build/icons/Chess Chase.ico" --add-data "chess.png;." main.py

      - name: Zip app
        shell: pwsh
        run: |
          $version = (uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          $zip = "chesschase-windows-v$version.zip"
          Compress-Archive -Path "dist/Chess Chase" -DestinationPath $zip -Force
          "ZIP=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          if ($tag -eq "") {
            $tag = $env:GITHUB_REF_NAME
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "Windows build for $tag"
          }
          gh release upload $tag $env:ZIP --clobber
